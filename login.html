<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Inicia sesión o regístrate en Pastelería SLIM." />
  <meta property="og:title" content="Pastelería SLIM" />
  <meta property="og:description" content="Inicia sesión o regístrate en Pastelería SLIM." />
  <meta property="og:image" content="assets/images/cake-chocolate.webp" />
  <meta name="theme-color" content="#5A320A" />
  <link rel="icon" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" />
  <title>Iniciar sesión | Pastelería SLIM</title>

  <!-- Unidad 4: frameworks CSS aplicados al sitio real -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script> tailwind.config = { corePlugins: { preflight: false, } }</script>
  <script src="js/config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js" defer></script>
  <script src="js/integracion-unidades.js" defer></script>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/integracion-unidades.css">
</head>

<body data-page="login">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <main id="contenido" class="login-page">
    <section class="login-visual">
      <div>
        <a class="brand" href="index.html"><img src="assets/images/logo.png" alt="Logo" /><span>Pastelería
            <em>SLIM</em></span></a>
        <h2 class="login-title title">
          Sabores que <span class="text-gold">enamoran</span>
        </h2>
        <p>Creaciones artesanales para cada momento especial.</p>
      </div>
    </section>
    <section class="login-form-wrap">
      <div class="login-card">
        <a class="brand" href="index.html"><img src="assets/images/logo.png" alt="Logo" /><span>Pastelería
            <em>SLIM</em></span></a>
        <h1 data-auth-title>Bienvenido de vuelta</h1>
        <p class="muted">Ingresa para ver tus pedidos y favoritos.</p>
        <p class="info-box hidden" data-auth-notice></p>
        <div class="auth-toggle">
          <button class="active" data-mode="login">Iniciar sesión</button><button
            data-mode="register">Registrarme</button>
        </div>
        <form data-login-form>
          <div class="field hidden" data-register-field>
            <input class="input" name="nombres" placeholder="Nombres" autocomplete="given-name" />
          </div>
          <div class="field hidden" data-register-field>
            <input class="input" name="apellidos" placeholder="Apellidos" autocomplete="family-name" />
          </div>
          <div class="form-grid hidden" data-register-field>
            <select class="select browser-default" name="tipoDoc" aria-label="Tipo de documento">
              <option>DNI</option>
              <option>Carné de extranjería</option>
              <option>Pasaporte</option>
            </select><input class="input" name="numeroDoc" placeholder="N.° de documento" maxlength="15" />
          </div>
          <div class="field hidden" data-register-field>
            <input class="input" type="tel" name="telefono" placeholder="Teléfono" autocomplete="tel"
              pattern="[0-9+ ]{9,15}" />
          </div>
          <div class="form-grid hidden" data-register-field>
            <input class="input" name="domicilio" placeholder="Dirección" autocomplete="street-address" /><input
              class="input" name="distrito" placeholder="Distrito" autocomplete="address-level2" />
          </div>
          <div class="field">
            <input class="input" type="email" name="email" autocomplete="email" placeholder="Correo electrónico"
              required />
          </div>
          <div class="field password-field">
            <input id="password" class="input" type="password" name="password" autocomplete="current-password"
              placeholder="Contraseña" required /><button type="button" data-show-password>Ver</button>
          </div>
          <div class="field hidden" data-confirm-field>
            <input class="input" type="password" name="confirm" placeholder="Confirmar contraseña"
              autocomplete="new-password" />
          </div>
          <p class="error-text" data-auth-error role="alert"></p>
          <button class="btn full">Continuar</button>
        </form>
        <p class="center muted">
          <small>Al continuar aceptas nuestros
            <a class="text-link" href="servicio-cliente.html#terminos">términos y privacidad</a>.</small>
        </p>
      </div>
    </section>
  </main>
</body>

</html>
