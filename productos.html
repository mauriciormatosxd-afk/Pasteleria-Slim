<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Catálogo de tortas, pasteles, cupcakes, galletas y macarons artesanales."
    />
    <meta property="og:title" content="Pastelería SLIM" />
    <meta
      property="og:description"
      content="Catálogo de tortas, pasteles, cupcakes, galletas y macarons artesanales."
    />
    <meta property="og:image" content="assets/images/cake-chocolate.webp" />
    <meta name="theme-color" content="#5A320A" />
    <link rel="icon" href="assets/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    />
    <title>Productos | Pastelería SLIM</title>
    
    <!-- Unidad 4: frameworks CSS aplicados al sitio real -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/integracion-unidades.css">
    <script src="js/config.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/main.js" defer></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js" defer></script>
    <script src="js/integracion-unidades.js" defer></script>
</head>
  <body data-page="products">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div data-site-header></div>
    <main id="contenido">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">Colección artesanal</p>
          <h1>Nuestros <span>Productos</span></h1>
          <p>Creaciones artesanales para cada ocasión especial</p>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <div class="tabs">
            <button class="tab" data-cat-filter="todos">Todos</button
            ><button class="tab" data-cat-filter="tortas">Tortas</button
            ><button class="tab" data-cat-filter="pasteles">Pasteles</button
            ><button class="tab" data-cat-filter="cupcakes">Cupcakes</button
            ><button class="tab" data-cat-filter="galletas">Galletas</button
            ><button class="tab" data-cat-filter="macarons">Macarons</button
            ><button class="tab" data-cat-filter="especiales">Especiales</button
            ><button class="tab" data-cat-filter="tartas">Tartas</button>
          </div>
          <div class="toolbar">
            <input
              id="product-search"
              class="input"
              placeholder="Buscar en productos..."
            /><button class="chip" data-filter-toggle>Filtros</button
            ><select id="sort" class="select browser-default">
              <option value="relevance">Relevancia</option>
              <option value="price-asc">Precio: menor a mayor</option>
              <option value="price-desc">Precio: mayor a menor</option>
              <option value="rating">Mejor calificados</option></select
            ><span class="results-count" data-count></span>
          </div>
          <div class="filter-panel hidden" data-filter-panel>
            <label
              >Precio máximo: <strong data-price-value>S/ 500</strong></label
            ><br /><input
              id="max-price"
              type="range"
              min="100"
              max="600"
              step="10"
              value="500"
            />
          </div>
          <div class="product-grid" data-products></div>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
  </body>
</html>
