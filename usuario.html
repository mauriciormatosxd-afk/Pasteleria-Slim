<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Tu perfil, pedidos y favoritos." />
    <meta property="og:title" content="Pastelería SLIM" />
    <meta property="og:description" content="Tu perfil, pedidos y favoritos." />
    <meta property="og:image" content="assets/images/cake-chocolate.webp" />
    <meta name="theme-color" content="#5A320A" />
    <link rel="icon" href="assets/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    />
    <title>Mi cuenta | Pastelería SLIM</title>
    
    <!-- Unidad 4: frameworks CSS aplicados al sitio real -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/integracion-unidades.css">
    <script src="js/config.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/main.js" defer></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js" defer></script>
    <script src="js/integracion-unidades.js" defer></script>
</head>
  <body data-page="user">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div data-site-header></div>
    <main id="contenido">
      <section class="profile-banner">
        <div class="container profile-head">
          <span class="profile-avatar"></span>
          <div>
            <h1></h1>
            <p></p>
            <span class="chip active">Cliente VIP</span>
          </div>
          <div class="profile-actions" style="margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
            <a class="btn outline" href="admin.html" data-admin-link hidden>Ir al panel admin</a>
            <button class="btn outline" type="button" data-logout>Cerrar sesión</button>
          </div>
        </div>
      </section>
      <nav class="account-tabs">
        <div class="container">
          <button class="account-tab active" data-account-tab="profile">
            Perfil</button
          ><button class="account-tab" data-account-tab="orders">Pedidos</button
          ><button class="account-tab" data-account-tab="favorites">
            Favoritos</button
          ><button class="account-tab" data-account-tab="addresses">
            Direcciones</button
          ><button class="account-tab" data-account-tab="payment">Pagos</button>
        </div>
      </nav>
      <section class="section">
        <div class="container">
          <div id="profile" class="account-panel active">
            <form class="profile-form" data-profile-form>
              <h2>Información personal</h2>
              <div class="form-grid">
                <div class="field">
                  <label class="field-label" for="p-nombres">Nombres</label
                  ><input
                    class="input"
                    id="p-nombres"
                    name="nombres"
                    required
                  />
                </div>
                <div class="field">
                  <label class="field-label" for="p-apellidos">Apellidos</label
                  ><input
                    class="input"
                    id="p-apellidos"
                    name="apellidos"
                    required
                  />
                </div>
              </div>
              <div class="form-grid">
                <div class="field">
                  <label class="field-label" for="p-tipoDoc"
                    >Tipo de documento</label
                  ><select class="select browser-default" id="p-tipoDoc" name="tipoDoc">
                    <option>DNI</option>
                    <option>Carné de extranjería</option>
                    <option>Pasaporte</option>
                  </select>
                </div>
                <div class="field">
                  <label class="field-label" for="p-numeroDoc"
                    >N.° de documento</label
                  ><input
                    class="input"
                    id="p-numeroDoc"
                    name="numeroDoc"
                    required
                    maxlength="15"
                  />
                </div>
              </div>
              <div class="field">
                <label class="field-label" for="p-email"
                  >Correo electrónico</label
                ><input
                  class="input"
                  id="p-email"
                  name="email"
                  type="email"
                  readonly
                />
              </div>
              <div class="field">
                <label class="field-label" for="p-telefono">Teléfono</label
                ><input
                  class="input"
                  id="p-telefono"
                  name="telefono"
                  type="tel"
                  pattern="[0-9+ ]{{9,15}}"
                />
              </div>
              <div class="form-grid">
                <div class="field">
                  <label class="field-label" for="p-domicilio">Dirección</label
                  ><input class="input" id="p-domicilio" name="domicilio" />
                </div>
                <div class="field">
                  <label class="field-label" for="p-distrito">Distrito</label
                  ><input class="input" id="p-distrito" name="distrito" />
                </div>
              </div>
              <button class="btn full">Guardar cambios</button>
            </form>
          </div>
          <div id="orders" class="account-panel">
            <h2 class="fs-30-mb20 title">Historial de pedidos</h2>
            <div data-orders-list></div>
          </div>
          <div id="favorites" class="account-panel">
            <h2 class="fs-30 title">Mis favoritos</h2>
            <p class="muted">Aún no tienes favoritos.</p>
          </div>
          <div id="addresses" class="account-panel">
            <h2 class="fs-30 title">Mis direcciones</h2>
            <div data-address-list></div>
          </div>
          <div id="payment" class="account-panel">
            <h2 class="fs-30 title">Métodos de pago</h2>
            <p class="muted">
              Por tu seguridad no guardamos datos de tarjeta; los ingresas solo
              al pagar.
            </p>
          </div>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
  </body>
</html>
