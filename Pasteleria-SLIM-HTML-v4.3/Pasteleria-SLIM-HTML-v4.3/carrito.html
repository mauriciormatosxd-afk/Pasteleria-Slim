<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Revisa tu carrito y aplica tu cupón de descuento." />
  <meta property="og:title" content="Pastelería SLIM" />
  <meta property="og:description" content="Revisa tu carrito y aplica tu cupón de descuento." />
  <meta property="og:image" content="assets/images/cake-chocolate.webp" />
  <meta name="theme-color" content="#5A320A" />
  <link rel="icon" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" />
  <title>Carrito | Pastelería SLIM</title>

  <!-- Unidad 4: frameworks CSS aplicados al sitio real -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script> tailwind.config = { corePlugins: { preflight: false, } }</script>
  <script src="js/config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js" defer></script>
  <script src="js/integracion-unidades.js" defer></script>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/integracion-unidades.css">
</head>

<body data-page="cart">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <div data-site-header></div>
  <main id="contenido">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Tu selección</p>
        <h1>Mi <span>Carrito</span></h1>
        <p><span data-cart-title>3 productos</span></p>
      </div>
    </section>
    <section class="section">
      <div class="container cart-layout">
        <div class="cart-list" data-cart-list></div>
        <aside class="summary">
          <h2>Resumen del pedido</h2>
          <label for="coupon">Cupón de descuento</label>
          <div class="coupon-row">
            <input id="coupon" class="input" placeholder="SLIM20" /><button class="btn chocolate" data-coupon>
              Aplicar
            </button>
          </div>
          <p class="success-text" data-coupon-message></p>
          <div class="summary-line">
            <span>Subtotal</span><span data-subtotal></span>
          </div>
          <div class="summary-line">
            <span>Envío</span><span data-shipping></span>
          </div>
          <div class="summary-line">
            <span>Descuento</span><span data-discount></span>
          </div>
          <div class="summary-line total">
            <span>Total</span><span data-total></span>
          </div>
          <a class="btn full" href="checkout.html">Proceder al pago</a>
          <p class="center">
            <a class="text-link" href="productos.html">Continuar comprando</a>
          </p>
        </aside>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
</body>

</html>
