<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <meta property="og:title" content="Pastelería SLIM" />

  <link rel="icon" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" />
  <title>Finalizar pedido | Pastelería SLIM</title>

  <!-- Unidad 4: frameworks CSS aplicados al sitio real -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script> tailwind.config = { corePlugins: { preflight: false, } }</script>
  <script src="js/config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

<body data-page="checkout">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <div data-site-header></div>
  <main id="contenido">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Compra segura</p>
        <h1>Finalizar <span>pedido</span></h1>
        <p>Completa los datos para recibir tu pedido.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="stepper">
          <div class="step active">
            <span class="step-number">1</span><span>Entrega</span>
          </div>
          <div class="step">
            <span class="step-number">2</span><span>Pago</span>
          </div>
          <div class="step">
            <span class="step-number">3</span><span>Confirmación</span>
          </div>
        </div>
        <div class="mt-30 checkout-grid">
          <div data-checkout-area></div>
          <aside class="summary" data-checkout-summary></aside>
        </div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
</body>

</html>
